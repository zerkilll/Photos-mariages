<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos du Mariage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #1a1a1a; }
        p { color: #666; margin-bottom: 30px; line-height: 1.5; }
        .upload-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .upload-btn:active { opacity: 0.7; transform: scale(0.98); }
        .upload-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 25px; font-weight: 600; font-size: 15px; min-height: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 L'Album des Mariés</h1>
        <p>Partagez vos meilleures photos de la soirée en un clic.</p>

        <!-- L'input caché qui ouvre l'appareil photo/galerie -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        
        <!-- Le gros bouton visible -->
        <button id="uploadBtn" class="upload-btn">Envoyer une photo</button>
        
        <div id="status"></div>
    </div>

    <script>
        // ⚠️ 2. REMPLACE CETTE URL PAR CELLE DE TON DÉPLOIEMENT GOOGLE APPS SCRIPT ⚠️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwr-I8RFsZKRlxRnKIZUAeGNrOwEOiv7aomb_CnO-j4zHCnA_GhKHkwy-13UEdGqTHa2Q/exec";

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');

        // Quand on clique sur le bouton, on ouvre le sélecteur de fichier
        uploadBtn.addEventListener('click', () => fileInput.click());

        // Quand l'invité a choisi/pris une photo
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            uploadBtn.disabled = true;
            statusDiv.style.color = "#f39c12";
            statusDiv.innerText = "Préparation de l'image... ⏳";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    
                    // --- 1. COMPRESSION DE L'IMAGE ---
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200; // Taille max pour ne pas exploser le Drive
                    const MAX_HEIGHT = 1200;
                    let width = img.width;
                    let height = img.height;

                    // Calcul du redimensionnement tout en gardant les proportions
                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Conversion en JPEG compressé à 80% (0.8)
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const base64Content = dataUrl.split(',')[1];
                    
                    statusDiv.style.color = "#3498db";
                    statusDiv.innerText = "Envoi en cours... 🚀";

                    // --- 2. ENVOI AU SERVEUR GOOGLE ---
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        // Utiliser text/plain évite une erreur de sécurité CORS courante avec Google Script
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                        body: JSON.stringify({
                            fileName: "Photo_" + Date.now() + ".jpg", // Nomme le fichier avec l'heure exacte
                            mimeType: "image/jpeg",
                            fileData: base64Content
                        })
                    })
                    .then(response => {
                        statusDiv.style.color = "#27ae60";
                        statusDiv.innerText = "Photo envoyée avec succès ! 🎉";
                        uploadBtn.disabled = false;
                        fileInput.value = ""; // Remet le bouton à zéro pour la prochaine
                    })
                    .catch(error => {
                        console.error(error);
                        statusDiv.style.color = "#e74c3c";
                        statusDiv.innerText = "Erreur lors de l'envoi. Le réseau est peut-être faible.";
                        uploadBtn.disabled = false;
                    });
                };
            };
        });
    </script>
</body>
</html>
