<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Verrouille le zoom et le défilement pour un effet "App" -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>L'Album de l'Événement</title>

    <!-- Polices élégantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream: #FBF6F1;
            --cream-edge: #F4E7D9;
            --blush: #C4938B;
            --terracotta: #8C5049;
            --ink: #3C2E2A;
            --ink-soft: #6E5A54;
            --gold: #C6A651;
            --gold-soft: rgba(198, 166, 81, 0.35);
            --success-bg: #F4EEDD;
            --success-ink: #8A6D2F;
            --error: #A8443C;
            --error-bg: #FBEBE9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: var(--ink);
        }

        body {
            background: radial-gradient(120% 90% at 50% 12%, var(--cream-edge) 0%, var(--cream) 55%),
                        var(--cream);
        }

        .frame {
            position: relative;
            height: 100vh;
            height: 100dvh;
            width: 100%;
        }

        /* Coins décoratifs façon carte d'invitation */
        .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 1.5px solid var(--gold);
            opacity: 0.55;
            pointer-events: none;
        }
        .corner-tl { top: max(16px, env(safe-area-inset-top)); left: 16px; border-right: none; border-bottom: none; }
        .corner-tr { top: max(16px, env(safe-area-inset-top)); right: 16px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: max(16px, env(safe-area-inset-bottom)); left: 16px; border-right: none; border-top: none; }
        .corner-br { bottom: max(16px, env(safe-area-inset-bottom)); right: 16px; border-left: none; border-top: none; }

        .app-container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: max(9vh, calc(env(safe-area-inset-top) + 5vh)) 8vw max(6vh, calc(env(safe-area-inset-bottom) + 4vh));
            text-align: center;
        }

        .header {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            animation: fadeUp 0.7s ease both;
        }

        .ornament { color: var(--gold); margin-bottom: 18px; }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(26px, 7.5vw, 34px);
            color: var(--terracotta);
            margin: 0 0 12px 0;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        p.subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 16px;
            color: var(--ink-soft);
            margin: 0;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .main-action {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            animation: fadeUp 0.9s ease both;
        }

        .shutter-wrap {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shutter-wrap::before,
        .shutter-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid var(--gold-soft);
            animation: pulse 3.2s ease-out infinite;
        }
        .shutter-wrap::after { animation-delay: 1.6s; }

        /* Bouton principal, forme "déclencheur" */
        .shutter-btn {
            position: relative;
            z-index: 1;
            width: 168px;
            height: 168px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--blush), var(--terracotta));
            border: none;
            box-shadow: 0 16px 32px rgba(140, 80, 73, 0.32), inset 0 0 0 2px var(--gold-soft);
            cursor: pointer;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
        }

        .shutter-btn svg { width: 34px; height: 34px; }

        .shutter-btn span {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .shutter-btn:active {
            transform: scale(0.94);
            box-shadow: 0 8px 18px rgba(140, 80, 73, 0.28), inset 0 0 0 2px var(--gold-soft);
        }

        .shutter-btn:disabled {
            background: linear-gradient(145deg, #CFC4BE, #B7ABA4);
            box-shadow: none;
            cursor: not-allowed;
        }

        .shutter-wrap:has(.shutter-btn:disabled)::before,
        .shutter-wrap:has(.shutter-btn:disabled)::after {
            animation-play-state: paused;
            opacity: 0;
        }

        .footer {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 100%;
        }

        #status {
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            font-family: 'Montserrat', sans-serif;
            color: var(--ink-soft);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 40px;
            margin: 0 auto;
            transition: background 0.25s ease, color 0.25s ease;
        }
        #status:empty { padding: 12px 0; }

        .status-loading { background: var(--cream-edge); color: var(--ink-soft); }
        .status-loading::before {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--gold-soft);
            border-top-color: var(--gold);
            animation: spin 0.8s linear infinite;
            flex: none;
        }

        .status-success { background: var(--success-bg); color: var(--success-ink); }
        .status-success::before { content: '✓'; font-size: 14px; }

        .status-error { background: var(--error-bg); color: var(--error); }
        .status-error::before { content: '!'; font-weight: 700; }

        @keyframes pulse {
            0%   { transform: scale(0.86); opacity: 0.7; }
            80%  { transform: scale(1.22); opacity: 0; }
            100% { transform: scale(1.22); opacity: 0; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .header, .main-action { animation: none; }
            .shutter-wrap::before, .shutter-wrap::after { animation: none; opacity: 0; }
            .status-loading::before { animation: none; }
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="app-container">

            <div class="header">
                <svg class="ornament" width="72" height="14" viewBox="0 0 72 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="0" y1="7" x2="28" y2="7" stroke="currentColor" stroke-width="1"/>
                    <path d="M36 1 L42 7 L36 13 L30 7 Z" fill="currentColor"/>
                    <line x1="44" y1="7" x2="72" y2="7" stroke="currentColor" stroke-width="1"/>
                </svg>
                <!-- Le titre qui change selon l'URL (?titre=Mariage de X et Y) -->
                <h1 id="mainTitle">L'Album de la Soirée</h1>
                <p class="subtitle">Immortalisez l'instant</p>
            </div>

            <div class="main-action">
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <div class="shutter-wrap">
                    <button id="uploadBtn" class="shutter-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 8h3l1.6-2.2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
                            <circle cx="12" cy="13" r="3.4"/>
                        </svg>
                        <span>Ajouter<br>une photo</span>
                    </button>
                </div>
            </div>

            <div class="footer">
                <div id="status"></div>
            </div>

        </div>
    </div>

    <script>
        // ⚠️ N'OUBLIE PAS DE METTRE TON URL GOOGLE APPS SCRIPT ICI ⚠️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwr-I8RFsZKRlxRnKIZUAeGNrOwEOiv7aomb_CnO-j4zHCnA_GhKHkwy-13UEdGqTHa2Q/exec";

        // GESTION DU TITRE DYNAMIQUE VIA L'URL
        const urlParams = new URLSearchParams(window.location.search);
        const titrePersonnalise = urlParams.get('titre');
        if (titrePersonnalise) {
            document.getElementById('mainTitle').innerText = titrePersonnalise;
        }

        // LOGIQUE D'ENVOI ET DE COMPRESSION (Qualité HD 2500px)
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');

        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            uploadBtn.disabled = true;
            statusDiv.className = "status-loading";
            statusDiv.innerText = "Préparation de la photo…";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {

                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 2500;
                    const MAX_HEIGHT = 2500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                    const base64Content = dataUrl.split(',')[1];

                    statusDiv.className = "status-loading";
                    statusDiv.innerText = "Envoi en cours…";

                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            fileName: "Photo_" + Date.now() + ".jpg",
                            mimeType: "image/jpeg",
                            fileData: base64Content
                        })
                    })
                    .then(response => {
                        statusDiv.className = "status-success";
                        statusDiv.innerText = "Photo envoyée avec succès";
                        uploadBtn.disabled = false;
                        fileInput.value = "";

                        setTimeout(() => {
                            if (statusDiv.className === "status-success") {
                                statusDiv.innerText = "";
                                statusDiv.className = "";
                            }
                        }, 5000);
                    })
                    .catch(error => {
                        statusDiv.className = "status-error";
                        statusDiv.innerText = "Erreur réseau, réessayez";
                        uploadBtn.disabled = false;
                    });
                };
            };
        });
    </script>
</body>
</html>
